    <h1>Vocabulaire anglais</h1>
    <p>Les mots essentiels des niveaux A1, A2, B1 et B2, classés par thème, avec la traduction en français et en espagnol. Clique sur le haut-parleur pour entendre la prononciation anglaise.</p>

      <button class="lv" role="tab" id="lv-B1" data-level="B1" aria-selected="false"><b>B1</b><span>Intermédiaire</span></button>

    <p id="level-note"></p>
  </header>

    </div>
    <div class="row">

</div>

function parse(raw) {
  const list = [];
  let cur = null;
  raw.trim().split("\n").forEach(line => {
    line = line.trim();
    if (!line) return;
    if (line.startsWith("#")) { cur = { name: line.slice(1).trim(), words: [] }; list.push(cur); return; }
    const [en, fr, es] = line.split("|");
    cur.words.push({ en, fr, es });
  });
  return list;
}
const DATA = {};
Object.keys(LEVELS).forEach(k => { DATA[k] = parse(LEVELS[k]); });
const NOTES = {
  A1: "Débutant : se présenter, parler de sa famille, de sa maison et de la vie quotidienne.",
  A2: "Élémentaire : faire des achats, voyager, parler de sa santé, de son travail et de ses loisirs. Ces mots s'ajoutent à ceux du niveau A1.",
  B1: "Intermédiaire : donner son avis, parler de société, d'environnement et de ses projets. Attention aux faux amis signalés ! Ces mots s'ajoutent à ceux des niveaux A1 et A2.",
  B2: "Intermédiaire avancé : argumenter, parler du monde du travail, de sciences et de société, avec des verbes à particule, des expressions idiomatiques et les faux amis les plus courants."
};

let level = "A1";
let cats = DATA[level];
let total = 0;
const out = document.getElementById("out");
const q = document.getElementById("q");
const sel = document.getElementById("cat");
const count = document.getElementById("count");
const note = document.getElementById("level-note");
const hidden = { en: false, fr: false, es: false };

function setLevel(l) {
  level = l;
  cats = DATA[l];
  total = cats.reduce((n, c) => n + c.words.length, 0);
  sel.length = 1;
  cats.forEach((c, i) => {
    const o = document.createElement("option");
    o.value = String(i); o.textContent = c.name + " (" + c.words.length + ")";
    sel.appendChild(o);
  });
  sel.value = "";
  document.querySelectorAll(".lv").forEach(b => b.setAttribute("aria-selected", String(b.dataset.level === l)));
  note.textContent = NOTES[l];
  try { history.replaceState(null, "", "#" + l.toLowerCase()); } catch (err) {}
  render();
}
document.querySelectorAll(".lv").forEach(b => b.addEventListener("click", () => setLevel(b.dataset.level)));

const norm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
const esc = s => s.replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
const speaker = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5z" fill="currentColor"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>';

function render() {
  const term = norm(q.value.trim());
  const only = sel.value;
  let shown = 0;
  let html = "";
  cats.forEach((c, i) => {
    if (only !== "" && String(i) !== only) return;
    const words = term ? c.words.filter(w => norm(w.en + " " + w.fr + " " + w.es).includes(term)) : c.words;
    if (!words.length) return;
    shown += words.length;
    html += '<section><h2>' + esc(c.name) + ' <small>' + words.length + ' mots</small></h2><div class="list">' +
      '<div class="head"><div>Anglais</div><div>Français</div><div>Espagnol</div></div>';
    words.forEach(w => {
      html += '<div class="w">' +
        '<div class="en' + (hidden.en ? " hidden-col" : "") + '"><button class="say" data-say="' + esc(w.en) + '" aria-label="Écouter ' + esc(w.en) + '">' + speaker + '</button><span class="cell-text">' + esc(w.en) + '</span></div>' +
        '<div class="fr' + (hidden.fr ? " hidden-col" : "") + '"><span class="lang-tag">FR</span><span class="cell-text">' + esc(w.fr) + '</span></div>' +
        '<div class="es' + (hidden.es ? " hidden-col" : "") + '"><span class="lang-tag">ES</span><span class="cell-text">' + esc(w.es) + '</span></div>' +
        '</div>';
    });
    html += '</div></section>';
  });
  out.innerHTML = html || '<p class="empty">Aucun mot trouvé pour « ' + esc(q.value) + ' ».</p>';
  count.textContent = shown === total ? total + " mots" : shown + " / " + total + " mots";
}

out.addEventListener("click", e => {
  const b = e.target.closest(".say");
  if (b) {
    try {
      const text = b.dataset.say.replace(/\(.*?\)/g, "").split("/")[0].replace("…", "").trim();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "en-GB"; u.rate = 0.85;
      speechSynthesis.cancel(); speechSynthesis.speak(u);
    } catch (err) {}
    return;
  }
  const t = e.target.closest(".hidden-col .cell-text");
  if (t) t.classList.toggle("shown");
});

document.querySelectorAll(".toggle").forEach(btn => btn.addEventListener("click", () => {
  const col = btn.dataset.col;
  hidden[col] = !hidden[col];
  btn.setAttribute("aria-pressed", String(hidden[col]));
  render();
}));
q.addEventListener("input", render);
sel.addEventListener("change", render);
const start = (location.hash || "").slice(1).toUpperCase();
setLevel(DATA[start] ? start : "A1");
</script>
