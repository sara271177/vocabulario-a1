section { margin-top: 30px; }

.list { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.head, .w { display: grid; grid-template-columns: 1.15fr 1.1fr 1.1fr; gap: 12px; padding: 9px 14px; align-items: center; }

    </div>

      <button class="toggle" id="t-es" data-col="es" aria-pressed="false">Espagnol</button>

    </div>
  </div>

const cats = [];
let cur = null;
RAW.trim().split("\n").forEach(line => {
  line = line.trim();
  if (!line) return;
  if (line.startsWith("#")) { cur = { name: line.slice(1).trim(), words: [] }; cats.push(cur); return; }
  const [en, fr, es] = line.split("|");
  cur.words.push({ en, fr, es });
});

const total = cats.reduce((n, c) => n + c.words.length, 0);
const out = document.getElementById("out");
const q = document.getElementById("q");
const sel = document.getElementById("cat");
const count = document.getElementById("count");
const hidden = { en: false, fr: false, es: false };

cats.forEach((c, i) => {
  const o = document.createElement("option");
  o.value = String(i); o.textContent = c.name + " (" + c.words.length + ")";
  sel.appendChild(o);
});

const norm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
const esc = s => s.replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
const speaker = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5z" fill="currentColor"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>';

function render() {
  const term = norm(q.value.trim());
  const only = sel.value;
  let shown = 0;
  let html = "";
  cats.forEach((c, i) => {
    if (only !== "" && String(i) !== only) return;
    const words = term ? c.words.filter(w => norm(w.en + " " + w.fr + " " + w.es).includes(term)) : c.words;
    if (!words.length) return;
    shown += words.length;
    html += '<section><h2>' + esc(c.name) + ' <small>' + words.length + ' mots</small></h2><div class="list">' +
      '<div class="head"><div>Anglais</div><div>Français</div><div>Espagnol</div></div>';
    words.forEach(w => {
      html += '<div class="w">' +
        '<div class="en' + (hidden.en ? " hidden-col" : "") + '"><button class="say" data-say="' + esc(w.en) + '" aria-label="Écouter ' + esc(w.en) + '">' + speaker + '</button><span class="cell-text">' + esc(w.en) + '</span></div>' +
        '<div class="fr' + (hidden.fr ? " hidden-col" : "") + '"><span class="lang-tag">FR</span><span class="cell-text">' + esc(w.fr) + '</span></div>' +
        '<div class="es' + (hidden.es ? " hidden-col" : "") + '"><span class="lang-tag">ES</span><span class="cell-text">' + esc(w.es) + '</span></div>' +
        '</div>';
    });
    html += '</div></section>';
  });
  out.innerHTML = html || '<p class="empty">Aucun mot trouvé pour « ' + esc(q.value) + ' ».</p>';
  count.textContent = shown === total ? total + " mots" : shown + " / " + total + " mots";
}

out.addEventListener("click", e => {
  const b = e.target.closest(".say");
  if (b) {
    try {
      const text = b.dataset.say.replace(/\(.*?\)/g, "").split("/")[0].replace("…", "").trim();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "en-GB"; u.rate = 0.85;
      speechSynthesis.cancel(); speechSynthesis.speak(u);
    } catch (err) {}
    return;
  }
  const t = e.target.closest(".hidden-col .cell-text");
  if (t) t.classList.toggle("shown");
});

document.querySelectorAll(".toggle").forEach(btn => btn.addEventListener("click", () => {
  const col = btn.dataset.col;
  hidden[col] = !hidden[col];
  btn.setAttribute("aria-pressed", String(hidden[col]));
  render();
}));
q.addEventListener("input", render);
sel.addEventListener("change", render);
render();
</script>
